name: Android CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Verify pinned sing-box AAR checksum
        shell: bash
        run: |
          set -euo pipefail
          expected="d2685924a657705beda44e94c6dc499e781df1ad20d65474e3591ec2f8b96465"
          aar="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.github.singbox-android/libbox/1.14.4" -type f -name '*.aar' -print -quit)"
          test -n "$aar"
          actual="$(sha256sum "$aar" | awk '{print $1}')"
          echo "Resolved libbox AAR: $aar"
          echo "Expected SHA-256: $expected"
          echo "Actual SHA-256:   $actual"
          test "$actual" = "$expected"
      - uses: actions/upload-artifact@v4
        with:
          name: netpulse-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
