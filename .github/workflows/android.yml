name: Android CI
on:
  push:
    branches: [ "main", "feature/native-netpulse-dashboard" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run five-pass NetPulse UI regression tests
        run: node scripts/verify-netpulse-ui.mjs
      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Verify pinned sing-box AAR checksum
        shell: bash
        run: |
          set -euo pipefail
          expected="d2685924a657705beda44e94c6dc499e781df1ad20d65474e3591ec2f8b96465"
          aar="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.github.singbox-android/libbox/1.14.4" -type f -name '*.aar' -print -quit)"
          test -n "$aar"
          actual="$(sha256sum "$aar" | awk '{print $1}')"
          echo "Resolved libbox AAR: $aar"
          echo "Expected SHA-256: $expected"
          echo "Actual SHA-256:   $actual"
          test "$actual" = "$expected"
      - name: Inspect pinned libbox Android API
        shell: bash
        run: |
          set -euo pipefail
          aar="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.github.singbox-android/libbox/1.14.4" -type f -name '*.aar' -print -quit)"
          work="$(mktemp -d)"
          unzip -p "$aar" classes.jar > "$work/classes.jar"
          for type in \
            io.nekohasekai.libbox.PlatformInterface \
            io.nekohasekai.libbox.TunOptions \
            io.nekohasekai.libbox.CommandServer \
            io.nekohasekai.libbox.CommandServerHandler \
            io.nekohasekai.libbox.OverrideOptions \
            io.nekohasekai.libbox.InterfaceUpdateListener \
            io.nekohasekai.libbox.NetworkInterfaceIterator \
            io.nekohasekai.libbox.NetworkInterface \
            io.nekohasekai.libbox.InterfaceType \
            io.nekohasekai.libbox.Libbox \
            io.nekohasekai.libbox.StringIterator \
            io.nekohasekai.libbox.InterfaceAddress \
            io.nekohasekai.libbox.DNSRule \
            io.nekohasekai.libbox.ConnectionOwner \
            io.nekohasekai.libbox.RoutePrefix \
            io.nekohasekai.libbox.RoutePrefixIterator \
            io.nekohasekai.libbox.StringBox \
            io.nekohasekai.libbox.Notification \
            io.nekohasekai.libbox.SystemProxyStatus \
            io.nekohasekai.libbox.WIFIState \
            io.nekohasekai.libbox.PlatformUser \
            io.nekohasekai.libbox.BridgeOptions \
            io.nekohasekai.libbox.BridgeSession \
            io.nekohasekai.libbox.AutoRedirectSession \
            io.nekohasekai.libbox.AutoRedirectHandler \
            io.nekohasekai.libbox.ShellSession \
            io.nekohasekai.libbox.LocalDNSTransport \
            io.nekohasekai.libbox.NeighborUpdateListener \
            io.nekohasekai.libbox.NeighborEntryIterator
          do
            echo "===== $type ====="
            if ! javap -classpath "$work/classes.jar" -p "$type"; then
              echo "Class not present in pinned AAR: $type"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: netpulse-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
